name: Compilar y Publicar APK Android (Obtainium & Releases)

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Resolver versión de la compilación
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VERSION="${{ github.ref_name }}"
            APP_VERSION="${APP_VERSION#v}"
          else
            APP_VERSION="$(node -p "require('./package.json').version")"
          fi

          BASE_VERSION="${APP_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          BASE_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))
          if [[ "$APP_VERSION" =~ -beta\.([0-9]+)$ ]]; then
            VERSION_CODE=$((BASE_CODE + BASH_REMATCH[1]))
          else
            VERSION_CODE=$((BASE_CODE + 99))
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Compilar aplicación web (dist)
        run: VITE_APP_VERSION="v${APP_VERSION}" npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Configurar JDK 21 (Java)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Aceptar licencias Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compilar APK con Gradle
        run: |
          echo "Compilando APK versión $APP_VERSION (versionCode: $APP_VERSION_CODE)..."
          cd android
          ./gradlew assembleDebug -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_VERSION_CODE" --stacktrace

      - name: Preparar APK con nombre amigable
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/control-tension-client-app.apk

      - name: Subir APK como Artefacto de Workflow
        uses: actions/upload-artifact@v7
        with:
          name: control-tension-client-app-apk-${{ env.APP_VERSION }}
          path: android/app/build/outputs/apk/debug/control-tension-client-app.apk
          retention-days: 14

      - name: Publicar APK en GitHub Releases (GitHub CLI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="v${APP_VERSION}"
          if [[ "$APP_VERSION" == *-* ]]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi
          echo "Publicando release $TAG con GitHub CLI..."
          gh release create "$TAG" android/app/build/outputs/apk/debug/control-tension-client-app.apk --title "$TAG" --notes "Release $TAG - Control Tensión Client App APK (Cliente Autoalojado)" "$RELEASE_FLAG" || gh release upload "$TAG" android/app/build/outputs/apk/debug/control-tension-client-app.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
